name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: mypy
        run: uv run mypy src/freezebase

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - name: Run tests with coverage
        run: >
          uv run --python ${{ matrix.python-version }} --all-extras
          pytest -q --cov=freezebase --cov-branch --cov-report=term-missing

  test-lowest:
    # Verifies the declared dependency lower bounds actually install and pass on
    # the minimum supported Python (3.12). `--resolution lowest-direct` pins
    # every direct dependency (runtime, extras, and dev tools) to its floor, so
    # the dev group carries lower bounds too (see [dependency-groups] in
    # pyproject.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - name: Sync dependencies at their lower bounds
        run: uv sync --all-extras --resolution lowest-direct --python 3.12
      - name: Run tests
        # --no-sync keeps `uv run` from re-resolving the environment back to the
        # latest versions before running.
        run: uv run --no-sync pytest -q

  test-s3:
    # Exercises the credentialed S3 read/write paths (`_s3_env`) against a real
    # MinIO server -- the object-store code unit tests can't reach.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=testkey -e MINIO_ROOT_PASSWORD=testsecret \
            minio/minio server /data
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
      - name: Run S3 integration tests
        env:
          FREEZEBASE_TEST_S3_ENDPOINT: http://localhost:9000
          FREEZEBASE_TEST_S3_KEY: testkey
          FREEZEBASE_TEST_S3_SECRET: testsecret
        run: uv run --all-extras pytest -q -m integration

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from git tags/history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - name: Smoke-test base wheel in a clean environment
        run: |
          uv venv /tmp/base
          uv pip install --python /tmp/base "$(ls dist/*.whl)"
          uv run --python /tmp/base --no-project python -c "import freezebase; from freezebase import mgrs, raster, vrt, download, vectools; print('base import OK')"
      - name: Smoke-test [s3] wheel in a clean environment
        run: |
          uv venv /tmp/s3
          uv pip install --python /tmp/s3 "$(ls dist/*.whl)[s3]"
          uv run --python /tmp/s3 --no-project python -c "import freezebase.s3; print('s3 import OK')"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
