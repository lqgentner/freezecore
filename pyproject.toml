[project]
name = "freezecore"
description = "Lightweight geospatial helpers for reproducible MGRS grids and local or S3-backed raster workflows."
authors = [
  { name = "Luis Gentner" , email = "luis.gentner@geo.uzh.ch"},
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "geospatial",
    "mgrs",
    "utm",
    "raster",
    "geotiff",
    "cog",
    "vrt",
    "s3",
    "sentinel-1",
    "remote-sensing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dynamic = ["version"]
# Lower bounds reflect the oldest release that both supports the required
# Python (>=3.12) and works with this code. Notably `numpy>=2.0` is required
# because the code uses `np.concat` (added in NumPy 2.0).
dependencies = [
    "affine>=2.4.0",
    "geopandas>=1.1",
    "mgrs>=1.4.4",
    "numpy>=2.0",
    "odc-geo>=0.5.0",
    "pandas>=2.3",
    "platformdirs>=3.0",
    "pyarrow>=17.0",
    "pyproj>=3.6.1",
    "rasterio>=1.5.0",
    "requests>=2.28",
    "rich>=13",
    "shapely>=2.1.0",
    "tenacity>=8.2",
    "universal-pathlib>=0.3",
]

[project.optional-dependencies]
s3 = [
    # s3fs 2026.2.0 first exposes `set_custom_error_handler` (used in s3.py).
    "s3fs>=2026.2.0",
    "fsspec>=2026.2.0",
    "boto3>=1.36",
]

[project.urls]
Homepage = "https://github.com/lqgentner/freezecore"
Repository = "https://github.com/lqgentner/freezecore"
Issues = "https://github.com/lqgentner/freezecore/issues"
Changelog = "https://github.com/lqgentner/freezecore/blob/main/CHANGELOG.md"

[dependency-groups]
# Dev tools carry lower bounds too, so `uv sync --resolution lowest-direct`
# (used by the lowest-bound CI job) resolves a working toolchain instead of
# dragging e.g. pytest down to an ancient, uninstallable release.
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-geopandas>=1.0",
    "types-requests>=2.31",
]
# Documentation toolchain. `great-docs` renders the site via Quarto (which must
# be installed separately, see user_guide/). The plotting stack is only needed
# because the user guide executes its figures at build time.
docs = [
    "great-docs>=0.16",
    "matplotlib>=3.9",
    "contextily>=1.6",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/freezecore"]

# Ship a lean, reproducible sdist: the package sources, the test suite (so
# downstreams can run it), and the project/license/readme metadata -- but not
# local developer scaffolding (`.python-version`, `.gitignore`, `uv.lock`).
[tool.hatch.build.targets.sdist]
include = [
    "src/freezecore",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]
exclude = [".gitignore"]

[tool.ruff]
line-length = 99
src = ["src"]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
# Source: https://github.com/CoreyMSchafer/dotfiles/blob/master/settings/ruff.toml
extend-select = [
    "E",    # Pycodestyle errors (style issues)
    "W",    # Pycodestyle warnings (style issues)
    "C90",  # McCabe – complexity metric for functions
    "I",    # isort – import ordering checks
    "N",    # PEP8 Naming – naming conventions
    "D",    # Pydocstyle – docstring formatting
    "UP",   # Pyupgrade – upgrades syntax to newer Python versions
    "YTT",  # Flake8-2020 – checks for Python 2020 best practices
    "ANN",  # Flake8-annotations – enforces type annotation style
    "ASYNC",# Flake8-async – checks async/await usage
    "S",    # Flake8-bandit – security issues
    "BLE",  # Flake8-blind-except – flags bare excepts
    "FBT",  # Flake8-boolean-trap – potential pitfalls with booleans
    "B",    # Flake8-bugbear – common bug patterns
    "A",    # Flake8-builtins – misuse of Python built-in names
    "COM",  # Flake8-commas – trailing/comma issues
    "C4",   # Flake8-comprehensions – best practices in comprehensions
    "DTZ",  # Flake8-datetimez – requires timezone-aware datetime objects
    "T10",  # Flake8-debugger – debugger statements (e.g. pdb)
    "DJ",   # Flake8-django – Django-specific conventions
    "EM",   # Flake8-errmsg – error message style
    "EXE",  # Flake8-executable – executable file checks
    "FA",   # Flake8-future-annotations – future import for annotations
    "ISC",  # Flake8-implicit-str-concat – warns on implicit string concatenation
    "ICN",  # Flake8-import-conventions – enforces conventional import aliases
    "LOG",  # Flake8-logging – proper logging usage
    "G",    # Flake8-logging-format – logging format string issues
    "INP",  # Flake8-no-pep420 – warns against non-PEP420 namespace usage
    "PIE",  # Flake8-pie – Python improvement suggestions
    # "T20",  # Flake8-print – disallows print statements
    "PYI",  # Flake8-pyi – checks for type stub (.pyi) consistency
    "PT",   # Flake8-pytest-style – pytest best practices
    "Q",    # Flake8-quotes – enforces quote style consistency
    "RSE",  # Flake8-raise – proper raise statement usage
    "RET",  # Flake8-return – return statement issues
    "SLF",  # Flake8-self – flags instance methods that don't use self
    "SLOT", # Flake8-slots – suggests use of __slots__ where appropriate
    "SIM",  # Flake8-simplify – code simplification hints
    "TID",  # Flake8-tidy-imports – enforces specific import styles (e.g., no relative imports)
    "TC",   # Flake8-type-checking – proper import of typing in type checks
    "INT",  # Flake8-gettext – checks for proper internationalization usage
    "ARG",  # Flake8-unused-arguments – flags unused function arguments
    "PTH",  # Flake8-use-pathlib – encourages pathlib over os.path
    "TD",   # Flake8-todos – flags TODO comments
    "FIX",  # Flake8-fixme – flags FIXME comments
    # "ERA",  # Eradicate – detects commented-out code (potentially dangerous)
    "PD",   # Pandas-vet – checks pandas-specific code practices
    "PGH",  # Pygrep-hooks – custom grep hooks for linting
    "PL",   # Pylint – integration with Pylint conventions
    "TRY",  # Tryceratops – try/except usage suggestions
    "FLY",  # Flynt – f-string conversion suggestions
    "NPY",  # NumPy-specific rules – ensures NumPy coding standards
    "FAST", # FastAPI – FastAPI-specific linting rules
    "AIR",  # Airflow – Airflow-specific linting rules
    "PERF", # Perflint – performance-related checks
    "FURB", # Refurb – rules for code refurbishment
    "DOC",  # Pydoclint – docstring linting and consistency
    "RUF",  # Ruff-specific rules – additional Ruff checks
]

ignore = [
    "ANN003",   # flake8-annotations - Missing type annotations for **kwargs
    "ANN401",   # Dynamically typed expressions (typing.Any) are disallowed in `value`
    "PLR0913",  # Pylint - Too many arguments
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = false

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "S101",     # Allow asserts in tests
    "S105",     # Allow dummy passwords in tests
    "S106",     # Allow dummy passwords passed as arguments in tests
    "D101",     # Test class names are self-documenting
    "D102",     # Test method names are self-documenting
    "D103",     # Test function names are self-documenting
    "FBT",      # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    "PLR2004",  # Allow magic values in tests
    "SLF001",   # Allow accesses on "private" class members.
    "TC003",    # Runtime imports of stdlib types are fine in tests
]

[tool.ruff.lint.isort]
known-first-party = ["freezecore"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: tests requiring a live S3-compatible service (MinIO); configured via FREEZECORE_TEST_S3_* env vars, skipped when unset.",
]
filterwarnings = [
    # Raised inside rasterio's compiled _io.pyx read() path under NumPy 2.5;
    # only a future rasterio release (>1.5.0) can fix it at the source.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]

[tool.mypy]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["freezecore"]

[tool.coverage.report]
# Regression guard, not a target. The floor is intentionally below current
# coverage because the S3 credential/env paths in `raster.py` need a live
# object store to exercise; raise this as S3 integration tests land.
fail_under = 78
show_missing = true
